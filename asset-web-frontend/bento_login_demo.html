<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据资产检索系统 - 登录 (Bento Grids 风格)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =====================================================
       Bento Grids / Apple Style
       米白背景 + 圆角卡片 + 柔和阴影
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Apple 风格米白背景 + 渐变光球 */
      background: #F5F5F7;
      background-image:
        /* 左上角 - 蓝色光晕 */
        radial-gradient(600px circle at 10% 20%,
          rgba(0, 122, 255, 0.12) 0%,
          transparent 50%),
        /* 右下角 - 紫色光晕 */
        radial-gradient(500px circle at 90% 80%,
          rgba(88, 86, 214, 0.1) 0%,
          transparent 50%),
        /* 中间 - 淡粉色光晕 */
        radial-gradient(400px circle at 50% 50%,
          rgba(255, 45, 85, 0.05) 0%,
          transparent 50%);
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* AI 科技背景图 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./public/ai_bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      opacity: 0.6;
    }

    .login-card {
      width: 420px;
      padding: 48px;
      /* 完全不透明白色卡片 */
      background: #FFFFFF;
      /* 大圆角 - Apple 风格 */
      border-radius: 24px;
      /* 更强的阴影 - 从背景中凸显 */
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.05),
        0 10px 20px rgba(0, 0, 0, 0.08),
        0 20px 40px rgba(0, 0, 0, 0.1);
      /* 确保在背景之上 */
      position: relative;
      z-index: 10;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      /* 图标阴影 */
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.25);
    }

    .logo-icon svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .login-header h1 {
      color: #1D1D1F;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-header p {
      color: #86868B;
      font-size: 15px;
      font-weight: 400;
    }

    .login-form {
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      color: #1D1D1F;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid #D2D2D7;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      color: #1D1D1F;
      background: #FFFFFF;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input::placeholder {
      color: #86868B;
    }

    .form-input:hover {
      border-color: #86868B;
    }

    .form-input:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      /* Apple 蓝色 */
      background: #007AFF;
      color: white;
    }

    .login-btn:hover {
      background: #0066CC;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid #E8E8ED;
    }

    .hint {
      color: #86868B;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hint-icon {
      width: 16px;
      height: 16px;
      fill: #86868B;
    }

    .hint strong {
      color: #1D1D1F;
      font-weight: 500;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .login-card {
        width: calc(100% - 32px);
        padding: 32px 24px;
        margin: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
        </svg>
      </div>
      <h1>数据资产检索系统</h1>
      <p>请登录以继续</p>
    </div>

    <form class="login-form" onsubmit="return false;">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" class="form-input" placeholder="请输入用户名" value="admin">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" placeholder="请输入密码" value="••••••">
      </div>
      <button type="submit" class="login-btn">登录</button>
    </form>

    <div class="login-footer">
      <div class="hint">
        <svg class="hint-icon" viewBox="0 0 24 24">
          <path
            d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
        </svg>
        <span>普通用户: <strong>user</strong> / <strong>user123</strong></span>
      </div>
    </div>
  </div>
</body>

</html>

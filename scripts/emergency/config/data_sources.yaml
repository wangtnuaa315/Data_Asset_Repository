# 应急业务数据源配置
# 用于多表图片匹配和元数据导出

# MySQL数据库连接配置
mysql:
  host: "192.168.2.170"
  port: 3306
  user: "readonly"
  password: ""  # 请在部署时配置实际密码
  database: "ia_center"

# 数据源定义
data_sources:
  # 智能设备告警（薪火/深学/电信）
  ai_device_alarm:
    table: vp_ai_device_alarm
    description: "智能设备告警（薪火/深学/电信）"
    enabled: true
    
    # 核心字段映射
    fields:
      image_path: ALARM_IMG           # 图片路径字段
      alarm_name: ALARM_NAME          # 告警类型（用于分类）
      alarm_time: ALARM_TIME          # 告警时间（用于季度分类）
      device_code: DEV_CODE           # 设备编码
      analysis: analysis              # AI分析结果
      alarm_type: ALARM_TYPE          # 告警类型编码
      
    # 扩展字段（存入JSONB business_data）
    extra_fields:
      - DEV_NAME
      - CHANNEL_CODE
      - CHANNEL_NAME
      - AREA_CODE
      - STATUS
      - source
      - LEVEL
      - img_original_name

  # 海康设备告警
  hk_alarm:
    table: vp_hk_alarm
    description: "海康设备告警"
    enabled: true
    
    # 核心字段映射
    fields:
      image_path: ALARM_IMG
      secondary_image: img2           # 额外图片
      alarm_name: ALARM_NAME
      alarm_time: ALARM_TIME
      device_code: DEV_CODE
      analysis: analysis
      alarm_type: ALARM_TYPE
      
    # 扩展字段
    extra_fields:
      - DEV_NAME
      - CHANNEL_CODE
      - CHANNEL_NAME
      - AREA_CODE
      - STATUS
      - source
      - LEVEL
      - analysis_result
      - manual_review
      - review_comments

# 目标目录配置
target_directory:
  base_path: "/data/nas_data/10_Official_Library/02_应急_安全/02_历史告警归档"
  structure: "{alarm_name}/{year}_Q{quarter}"
